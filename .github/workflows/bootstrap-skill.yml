name: Bootstrap skill repository

on:
  push:
    branches:
      - feat/initial-first-principles-analysis-skill
    paths:
      - .github/workflows/bootstrap-skill.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/initial-first-principles-analysis-skill
          fetch-depth: 0

      - name: Expand repository payload
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .bootstrap/payload.part-00 \
            .bootstrap/payload.part-01 \
            .bootstrap/payload.part-02 \
            .bootstrap/payload.rest-00 \
            .bootstrap/payload.rest-01 \
            .bootstrap/payload.rest-02 \
            .bootstrap/payload.rest-03 \
            .bootstrap/payload.rest-04 \
            .bootstrap/payload.rest-05 \
            .bootstrap/payload.rest-06 \
            | base64 --decode | tar -xJf -
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-skill.yml
          python3 scripts/validate_skill.py

      - name: Commit generated skill
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add first-principles analysis skill"
          git push origin HEAD:feat/initial-first-principles-analysis-skill
