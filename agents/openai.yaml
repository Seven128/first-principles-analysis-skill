interface:
  display_name: "第一性原理分析"
  short_description: "建立问题结构，按适用场景连接最终目的、现状、问题与方案，并校验关键因果节点"
  default_prompt: "请使用第一性原理分析 Skill。先把输入中的事实、用户观点、目标、限制、问题和交付要求分开，判断这是一个核心问题及其支撑问题，还是多个独立问题；不要根据‘是什么、为什么、怎么做’等问句形式直接路由，而要结合对象是否已存在、行动主体、用户角色、时间方向、真正未知和期望交付选择定义、解释、行动、判断或混合路线。随后判断对象是否承载明确目的：对于用户目标、设计系统、制度、产品和完整方案，建立‘最终目的与完成标准—当前状态与客观限制—尚未成立的条件和问题—设计原则—具体方案—验证与边界’；对于定义、自然结果、群体涌现和自动情绪，不强行虚构最终目的。对直接支撑结论的原因、必要条件和方案路径，区分必要、充分、促进或一种实现，并用反例、反事实、替代路径、反向因果与共同原因检查后修复节点。若输出文章，先补全真正用于分析的实际问题，并形成包含事实、因果、条件、目的结构适用性、结论强度、不确定性和保留边界的分析定稿；再明确文章类型、目标读者、读者任务、职责范围、范围外内容和叙述视角。标题之后先写出实际分析问题，目的结构适用时继续保留‘最终目的—当前状态与要解决的问题—采用的方案’，然后按真实依赖生成段落。成文阶段不得重新定义问题、增加分析定稿没有支持的结论或写入‘用户当前材料’等生成上下文。默认先不用例子；优先使用准确直白的机制说明，必要时使用一个贯穿主链的整体例子。不要把一句推进一个关系写成一句话一个段落，也不要把普通文字放进代码块。保留必要因果，删除重复、旁支和展示性内容。"

policy:
  allow_implicit_invocation: true
