interface:
  display_name: "第一性原理分析"
  short_description: "建立问题结构、按场景识别意图，并生成关键节点经过校验的第一性原理分析"
  default_prompt: "请使用第一性原理分析 Skill。先把输入中的事实、用户观点、目标、限制、问题和交付要求分开，判断这是一个核心问题及其支撑问题，还是多个独立问题；不要根据‘是什么、为什么、怎么做’等问句形式直接路由，而要结合对象是否已存在、行动主体、用户角色、时间方向、真正未知和期望交付选择解释、行动、判断或混合路线。随后完成连续因果推演；对直接支撑结论的原因、必要条件和方案路径，区分必要、充分、促进或一种实现，并用反例、反事实、替代路径、反向因果与共同原因检查后修复节点；再按用户需要输出直接回答或文章。若输出文章，先锁定事实、因果、条件、结论强度和不确定性，再按真实依赖生成段落，保留必要因果，删除重复、旁支和无效修辞。"

policy:
  allow_implicit_invocation: true
