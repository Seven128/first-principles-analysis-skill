interface:
  display_name: "第一性原理分析"
  short_description: "建立问题结构，连接目的、现状、问题与方案，并把严密分析转换成直接成稿"
  default_prompt: >-
    请使用第一性原理分析 Skill。先把事实、用户观点、目标、限制、问题和交付要求分开，判断核心问题、支撑问题及独立问题；结合对象状态、行动主体、用户角色、时间方向和真正未知选择定义、解释、行动、判断或混合路线，不只看疑问词。对象承载明确目的时，建立最终目的、当前状态、缺失条件、设计原则、具体方案、验证与边界；原理还原可以先写对象稳定角色或目标状态，完成标准与实现后置。定义、自然结果、群体涌现和自动情绪不强行虚构目的。主要问题由目标与事实推出；原因、表现、当前应对和后果放在对应问题下，独立限制保留，不按材料顺序或固定数量拆成同级小节。关键节点区分必要、充分、促进与具体路径，通过反例、反事实、替代解释、反向因果和共同原因检查后修复。文章先形成包含内部完整分析任务、问题结构、关键事实和因果、适用目的节点、必须覆盖项、证据边界与不确定性的分析定稿，再建立文章类型、读者任务、范围、详细程度、视角与载体契约。标题后先写简短读者可见问题，不塞入支撑问题和机制目录；目的结构适用时继续保留最终目的、当前状态与要解决的问题、采用的方案。问题和判断直接陈述主答案；方案标题允许准确短名称或具体动作，紧邻正文解释作用和必要因果，不为完整句扩写名称标题。结论句应有完整具体判断，空泛标签、口号和自动加粗不算答案；保留必要否定、条件与不确定性，一句话足够时停止，复杂内容保留必要解释。分析先证明，呈现可以先给结论，标题已给结论时首句不重复。按输出规则删除重复主体、无用转折、无效限定、职责重复和展示性包装，保留术语、引语、真实比较和证据限制。信息在成为当前答案时出现；多个独立语义单元用合理小标题，父章节不预先复述子章节。同一论点可由相邻段落共同完成，不逐段重复结论、强制加粗或一句一段。例子在首次帮助理解时使用，直接说明已足够时不加；复用场景只展示新关系，假设例子明确标示且仅映射已成立关系。关键判断附近保留依据、展示与边界，允许有用回指和互补图文。普通文字不放代码块，不按固定字符数硬换行，不新增后置润色流程。独立对照只在迭代时按 evals/directness/README.md 执行，日常使用不增加评测前置条件；同一对话换角色仍属自查，独立调用需要宿主实际提供相应工具。

policy:
  allow_implicit_invocation: true
