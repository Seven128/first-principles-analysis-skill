interface:
  display_name: "第一性原理分析"
  short_description: "建立问题结构，连接目的、现状、问题与方案，并把严密分析转换成直接成稿"
  default_prompt: >-
    请使用第一性原理分析 Skill。先把输入中的事实、用户观点、目标、限制、问题和交付要求分开，判断这是一个核心问题及其支撑问题，还是多个独立问题；不要根据“是什么、为什么、怎么做”等问句形式直接路由，而要结合对象是否已存在、行动主体、用户角色、时间方向、真正未知和期望交付，选择定义、解释、行动、判断或混合路线。随后判断对象是否承载明确目的：目标求解型建立“最终目的—当前状态—缺失条件和问题—设计原则—具体方案—验证与边界”；人为设计系统的原理还原可以先写对象最终形成的稳定角色或目标状态，再由形成前能力与该状态之间的差距推出机制；定义、自然结果、群体涌现和自动情绪不强行虚构最终目的。对直接支撑结论的原因、必要条件和方案路径，区分必要、充分、促进或一种实现，并用反例、反事实、替代路径、反向因果与共同原因检查后修复节点。若输出文章，先形成包含内部完整分析任务、问题结构、事实、关键因果、目的节点、必须覆盖项、证据边界、不确定性和保留边界的分析定稿；再建立文章类型、目标读者、读者任务、职责范围、范围外内容、详细程度和叙述视角契约。标题之后先写由核心问题生成的简短读者可见问题，不能把支撑问题、机制目录和证据说明拼成长问句。目的结构适用时继续保留“最终目的—当前状态与要解决的问题—采用的方案”，每个节点只承担自身职责，完成标准和具体机制在后续对应位置展开。按真实依赖组织段落，信息在第一次成为必要答案时出现。标题直接写明对象和主要关系；多个独立语义单元使用小标题，紧凑单段使用段首粗体，父章节不提前复述全部子章节。默认先不用例子；必要时优先使用一个贯穿主链的整体例子。不要把一句推进一个关系写成一句话一个段落，也不要把普通文字放进代码块。保留必要因果，删除重复、旁支和展示性内容。

policy:
  allow_implicit_invocation: true
