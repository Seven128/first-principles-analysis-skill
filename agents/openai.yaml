interface:
  display_name: "第一性原理分析"
  short_description: "生成或回归因果严密、关键节点经过校验且有效信息密度高的第一性原理分析"
  default_prompt: "请使用第一性原理分析 Skill，先在内部补全问题并完成连续因果推演；对直接支撑结论的原因、必要条件和方案路径，区分必要、充分、促进或一种实现，并用反例、反事实、替代路径、反向因果与共同原因检查后修复节点；再按用户需要输出直接回答或文章。若输出文章，先锁定事实、因果、条件、结论强度和不确定性，再按真实依赖生成段落，保留必要因果，删除重复、旁支和无效修辞。"

policy:
  allow_implicit_invocation: true
